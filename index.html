<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Evita el zoom accidental y se adapta al ancho del dispositivo -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simulador RIGOL DS1102E - Canales Independientes y Cursores</title>
    <style>
        :root {
            --bg-page: #1a1a1a;
            --rigol-body: #e3e0d8;
            --rigol-dark: #b0aca0;
            --rigol-panel: #d1cdc3;
            --screen-bg: #051405;
            --trace-ch1: #fcec03;
            --trace-ch2: #00f0ff;
            --text-dark: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-page);
            margin: 0;
            padding: 0;
            display: block;
            min-height: 100vh;
            color: white;
            box-sizing: border-box;
            overflow-x: auto;
            user-select: none;
            -webkit-user-select: none; /* Para Safari en iOS */
        }

        .names-watermark {
            position: fixed;
            bottom: 15px;
            left: 20px;
            color: rgba(255, 255, 255, 0.4);
            font-family: monospace;
            font-size: 14px;
            z-index: 999999;
            pointer-events: none;
            letter-spacing: 1px;
        }

        .workspace {
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            gap: 80px; 
            padding: 40px 20px;
            width: max-content;
            margin: 0 auto;
            justify-content: center;
            align-items: flex-start;
        }

        /* --- ESTILOS RIGOL --- */
        .rigol-chassis {
            background-color: var(--rigol-body);
            border-radius: 10px;
            padding: 15px;
            padding-bottom: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: flex;
            gap: 15px;
            width: 800px;
            flex-shrink: 0;
            position: relative;
            z-index: 10;
        }

        .display-area {
            display: flex;
            gap: 10px;
        }

        .screen-bezel {
            background-color: #222;
            padding: 10px;
            border-radius: 5px;
            border: 2px solid #555;
            position: relative;
        }

        canvas {
            width: 500px;
            height: 375px;
            background-color: var(--screen-bg);
            display: block;
            border-radius: 2px;
            cursor: crosshair;
            touch-action: none; /* Evita el scroll al arrastrar cursores */
        }

        .screen-overlay-top {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            font-family: monospace;
            font-size: 14px;
            text-shadow: 1px 1px 2px #000;
        }
        
        .screen-overlay-bottom {
            position: absolute;
            bottom: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            font-family: monospace;
            font-size: 14px;
            text-shadow: 1px 1px 2px #000;
        }

        .measure-box {
            position: absolute;
            top: 45px;
            left: 15px;
            color: #fff;
            font-family: monospace;
            font-size: 13px;
            pointer-events: none;
            line-height: 1.5;
            text-shadow: 1px 1px 2px #000;
            background: rgba(0,0,0,0.5);
            padding: 5px;
            border-radius: 3px;
            display: none;
        }

        /* Soft Keys */
        .soft-keys-container {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            height: 375px;
            width: 150px;
        }

        .soft-key-row {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .soft-key-btn {
            width: 25px;
            height: 25px;
            background: linear-gradient(to right, #999, #ccc);
            border: 1px solid #555;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            flex-shrink: 0;
        }
        .soft-key-btn:active { background: #777; }

        .soft-key-label {
            font-family: monospace;
            font-size: 11px;
            color: #fff;
            background: rgba(0,0,0,0.6);
            padding: 2px 5px;
            border-radius: 3px;
            width: 100%;
            text-align: left;
            border: 1px solid #444;
        }

        .control-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-left: 5px;
        }

        .panel-group {
            background-color: var(--rigol-panel);
            border: 1px solid #aaa;
            border-radius: 5px;
            padding: 10px;
            position: relative;
        }
        .panel-group-title {
            position: absolute;
            top: -10px;
            left: 10px;
            background: var(--rigol-dark);
            color: #fff;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 3px;
            letter-spacing: 1px;
        }

        .btn {
            background: linear-gradient(to bottom, #f0f0f0, #ccc);
            border: 1px solid #999;
            border-radius: 4px;
            padding: 5px;
            font-size: 10px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            box-shadow: 0 2px 0 #888;
            text-align: center;
            width: 100%;
            touch-action: manipulation; /* Mejora la respuesta al toque */
        }
        .btn:active { transform: translateY(2px); box-shadow: none; }
        .btn.active { background: #a0a0a0; box-shadow: inset 0 2px 5px rgba(0,0,0,0.3); }
        .btn-yellow { background: linear-gradient(to bottom, #ffe066, #d4b000); border-color: #a08000;}
        .btn-blue { background: linear-gradient(to bottom, #66aaff, #0055cc); color: white; border-color: #003388;}

        .menu-group { display: flex; gap: 5px; justify-content: flex-start; }
        .run-control { display: flex; gap: 5px; justify-content: flex-end; margin-bottom: 10px; }

        .vertical-group, .horizontal-group, .trigger-group { display: flex; gap: 10px; }
        .vertical-buttons { display: flex; flex-direction: column; gap: 5px; flex: 1;}
        
        .knobs-area { display: flex; flex-direction: column; align-items: center; justify-content: space-around; flex: 2; gap: 15px;}
        .knob-wrapper { display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .knob-label { font-size: 9px; font-weight: bold; color: #333; }
        
        /* PERILLAS: Agregamos touch-action y cursor para móviles */
        .knob {
            width: 45px; height: 45px;
            background: radial-gradient(circle, #666, #333);
            border-radius: 50%; border: 3px solid #222;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
            position: relative; 
            cursor: ns-resize; /* Indica que se mueve arriba/abajo */
            touch-action: none; /* Evita que la página haga scroll al girar la perilla */
        }
        .knob-indicator {
            width: 4px; height: 18px; background: white;
            position: absolute; top: 3px; left: 50%;
            transform: translateX(-50%); border-radius: 2px;
        }

        .bnc-ports-container {
            position: absolute;
            bottom: 20px;
            left: 50px;
            display: flex;
            gap: 20px;
        }
        .bnc-port {
            width: 45px; height: 45px;
            background: radial-gradient(circle, #888 30%, #444 70%, #222 100%);
            border-radius: 50%; border: 3px solid #999;
            display: flex; justify-content: center; align-items: center;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
            position: relative;
        }
        .bnc-inner { width: 15px; height: 15px; background-color: #111; border-radius: 50%; border: 1px solid #666; }
        
        .bnc-label { position: absolute; bottom: -8px; color: #333; font-weight: bold; font-size: 12px; }
        .bnc-port.ch1 .bnc-label { color: #b0a000; }
        .bnc-port.ch2 .bnc-label { color: #0088cc; }

        /* --- GENERADOR LEYBOLD --- */
        .generator {
            background-color: #f0f0f0;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            width: 350px;
            flex-shrink: 0;
            color: var(--text-dark);
            border: 2px solid #ccc;
            height: fit-content;
            z-index: 5;
        }
        .gen-top-panel {
            background-color: #d8d8d8;
            border-radius: 6px;
            padding: 15px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            border: 1px solid #bbb;
        }
        .gen-section { display: flex; flex-direction: column; align-items: center; }
        .gen-label { font-size: 11px; font-weight: bold; margin-bottom: 5px; }
        
        .gen-knob-container {
            width: 50px; height: 50px;
            background: linear-gradient(135deg, #fff, #ccc);
            border-radius: 50%;
            box-shadow: 2px 4px 6px rgba(0,0,0,0.3);
            position: relative;
            margin-bottom: 5px;
        }
        .gen-knob-indicator {
            width: 4px; height: 20px; background: #222;
            position: absolute; top: 5px; left: 50%; transform: translateX(-50%);
            border-radius: 2px;
        }
        
        .wave-switch { display: flex; flex-direction: column; gap: 5px; margin-top: 15px; }
        .wave-btn { padding: 5px; border: 1px solid #999; background: #fff; border-radius: 4px; cursor: pointer; font-size: 12px; touch-action: manipulation; }
        .wave-btn.active { background: #333; color: #fff; }

        .terminals { display: flex; justify-content: flex-end; gap: 15px; margin-top: 10px; }
        .terminal { width: 25px; height: 25px; border-radius: 50%; border: 3px solid #333; position: relative; }
        .terminal.red { background-color: #d32f2f; }
        .terminal.black { background-color: #222; }
        .terminal-label { position: absolute; bottom: -15px; left: 50%; transform: translateX(-50%); font-size: 9px; font-weight: bold; }

        .gen-display {
            background: #111;
            color: #33ff33;
            font-family: monospace;
            font-size: 14px;
            text-align: center;
            padding: 8px;
            margin-top: 15px;
            border-radius: 4px;
            border: 2px solid #555;
            box-shadow: inset 0 0 10px rgba(0,255,0,0.2);
            display: flex;
            justify-content: space-around;
        }

        .gen-channel-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            border-top: 1px solid #ccc;
            padding-top: 10px;
        }
        .gen-ch-btn {
            padding: 5px 15px;
            border: 2px solid #999;
            background: #fff;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            touch-action: manipulation;
        }
        .gen-ch-btn.active-ch1 { background: #fcec03; border-color: #b0a000; color: #333; }
        .gen-ch-btn.active-ch2 { background: #00f0ff; border-color: #0088cc; color: #333; }

        /* --- CABLES INTERACTIVOS --- */
        #cableSvg { 
            position: fixed; 
            top: 0; left: 0; 
            width: 100vw; height: 100vh; 
            pointer-events: none; 
            z-index: 99999; 
        }
        .cable-path { fill: none; stroke-width: 6; stroke-linecap: round; filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.6)); }
        #pathCH1 { stroke: #ff3333; }
        #pathCH2 { stroke: #0088ff; }
        
        .probe-tip {
            position: fixed; 
            width: 22px; height: 22px;
            border: 3px solid #fff; border-radius: 50%;
            cursor: grab; z-index: 100000;
            box-shadow: 0 4px 8px rgba(0,0,0,0.6);
            touch-action: none; /* Crucial para que no haga scroll al arrastrar */
        }
        .probe-tip:active { cursor: grabbing; transform: scale(1.2); }
        
        .probe-ch1 { background: radial-gradient(circle, #ff7777, #cc0000); }
        .probe-ch2 { background: radial-gradient(circle, #77bbff, #0066cc); }

    </style>
</head>
<body>

    <div class="names-watermark">Laura A. Salamanca, Juan J. Fontalvo</div>

    <div class="workspace">
        <!-- RIGOL OSCILLOSCOPE -->
        <div class="rigol-chassis">
            
            <div class="display-area">
                <div class="screen-bezel">
                    <canvas id="scopeCanvas" width="1000" height="750"></canvas>
                    
                    <div class="screen-overlay-top">
                        <span id="ch1-info" style="color: var(--trace-ch1);">CH1 1.00V</span>
                        <span id="ch2-info" style="color: var(--trace-ch2);">CH2 1.00V</span>
                    </div>
                    
                    <div class="screen-overlay-bottom">
                        <span id="time-info" style="color: #fff;">Time 1.00ms</span>
                        <span id="trig-info" style="color: #ff3333; font-weight: bold;">Trig Auto</span>
                    </div>
                    
                    <div id="measure-box" class="measure-box"></div>
                </div>

                <!-- Soft Keys -->
                <div class="soft-keys-container">
                    <div class="soft-key-row"><button class="soft-key-btn" onclick="handleSoftKey(1)"></button><div class="soft-key-label" id="sk1"></div></div>
                    <div class="soft-key-row"><button class="soft-key-btn" onclick="handleSoftKey(2)"></button><div class="soft-key-label" id="sk2"></div></div>
                    <div class="soft-key-row"><button class="soft-key-btn" onclick="handleSoftKey(3)"></button><div class="soft-key-label" id="sk3"></div></div>
                    <div class="soft-key-row"><button class="soft-key-btn" onclick="handleSoftKey(4)"></button><div class="soft-key-label" id="sk4"></div></div>
                    <div class="soft-key-row"><button class="soft-key-btn" onclick="handleSoftKey(5)"></button><div class="soft-key-label" id="sk5"></div></div>
                </div>
            </div>

            <!-- Puertos BNC -->
            <div class="bnc-ports-container">
                <div class="bnc-port ch1" id="bnc1">
                    <div class="bnc-inner"></div>
                    <div class="bnc-label">CH1</div>
                </div>
                <div class="bnc-port ch2" id="bnc2">
                    <div class="bnc-inner"></div>
                    <div class="bnc-label">CH2</div>
                </div>
            </div>

            <!-- Panel de Control -->
            <div class="control-panel">
                <div class="panel-group">
                    <div class="panel-group-title">MENU</div>
                    <div class="run-control">
                        <button class="btn btn-yellow" onclick="autoSet()">AUTO</button>
                        <button class="btn" id="runStopBtn" onclick="toggleRunStop()">RUN/STOP</button>
                    </div>
                    <div class="menu-group">
                        <button class="btn" onclick="changeMenu('cursor')">Cursor</button>
                    </div>
                </div>

                <div class="panel-group">
                    <div class="panel-group-title">VERTICAL</div>
                    <div class="vertical-group">
                        <div class="vertical-buttons">
                            <button class="btn btn-yellow active" id="ch1Btn" onclick="selectChannel(1)">CH1</button>
                            <button class="btn btn-blue" id="ch2Btn" onclick="selectChannel(2)">CH2</button>
                        </div>
                        <div class="knobs-area">
                            <div class="knob-wrapper">
                                <div class="knob-label">POSITION</div>
                                <div class="knob" id="knobPosY"><div class="knob-indicator"></div></div>
                            </div>
                            <div class="knob-wrapper">
                                <div class="knob-label">SCALE</div>
                                <div class="knob" id="knobScaleY"><div class="knob-indicator"></div></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="panel-group">
                    <div class="panel-group-title">HORIZONTAL</div>
                    <div class="horizontal-group">
                        <div class="vertical-buttons">
                            <button class="btn" onclick="changeMenu('horizontal')">MENU</button>
                        </div>
                        <div class="knobs-area">
                            <div class="knob-wrapper">
                                <div class="knob-label">POSITION</div>
                                <div class="knob" id="knobPosX"><div class="knob-indicator"></div></div>
                            </div>
                            <div class="knob-wrapper">
                                <div class="knob-label">SCALE</div>
                                <div class="knob" id="knobScaleX"><div class="knob-indicator"></div></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="panel-group">
                    <div class="panel-group-title">TRIGGER</div>
                    <div class="trigger-group">
                        <div class="vertical-buttons">
                            <button class="btn" onclick="changeMenu('trigger')">MENU</button>
                            <button class="btn" onclick="trigger50()">50%</button>
                            <button class="btn" onclick="forceTrigger()">FORCE</button>
                        </div>
                        <div class="knobs-area">
                            <div class="knob-wrapper">
                                <div class="knob-label">LEVEL</div>
                                <div class="knob" id="knobTrigLevel"><div class="knob-indicator"></div></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- GENERADOR LEYBOLD -->
        <div class="generator">
            <div class="gen-top-panel">
                <div class="gen-section">
                    <div class="gen-label">f / Hz</div>
                    <div class="gen-knob-container"><div class="gen-knob-indicator" id="genKnobFreq"></div></div>
                    <input type="range" id="genFreq" min="1" max="10" step="0.1" value="1" style="width:100%">
                </div>
                <div class="gen-section">
                    <div class="gen-label">Multiplicador</div>
                    <div class="gen-knob-container"><div class="gen-knob-indicator" id="genKnobMult"></div></div>
                    <select id="genMult" style="width:100%; margin-top:5px; padding:2px;">
                        <option value="1">x 1</option>
                        <option value="10">x 10</option>
                        <option value="100">x 100</option>
                        <option value="1000" selected>x 1k</option>
                    </select>
                </div>
                <div class="gen-section">
                    <div class="gen-label">U / V<sub>s</sub></div>
                    <div class="gen-knob-container"><div class="gen-knob-indicator" id="genKnobAmp"></div></div>
                    <input type="range" id="genAmp" min="0.1" max="10" step="0.1" value="2" style="width:100%">
                </div>
            </div>

            <div class="gen-display">
                <span id="genDisplayFreq">f: 1.00 kHz</span>
                <span id="genDisplayVolt">Vpp: 4.00 V</span>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding: 0 10px;">
                <div class="wave-switch">
                    <button class="wave-btn active" data-wave="sine" onclick="setWave('sine')">∿ Senoidal</button>
                    <button class="wave-btn" data-wave="square" onclick="setWave('square')">⊓ Cuadrada</button>
                    <button class="wave-btn" data-wave="triangle" onclick="setWave('triangle')">Λ Triangular</button>
                </div>
                <div class="terminals">
                    <div class="terminal red" id="redTerminal"><div class="terminal-label">U~</div></div>
                    <div class="terminal black"><div class="terminal-label">⏚</div></div>
                </div>
            </div>
            
            <div class="gen-channel-selector">
                <button class="gen-ch-btn active-ch1" id="genCh1" onclick="setGeneratorTarget(1)">CH1</button>
                <button class="gen-ch-btn" id="genCh2" onclick="setGeneratorTarget(2)">CH2</button>
            </div>

            <div style="display: flex; justify-content: space-between; margin-top: 15px; font-size: 11px; color: #555; font-weight: bold;">
                <span>LEYBOLD®</span>
                <span>522 621<br>FUNKTIONSGENERATOR S 12</span>
            </div>
        </div>
    </div>

    <svg id="cableSvg">
        <path id="pathCH1" class="cable-path" d="M 0 0 L 0 0" />
        <path id="pathCH2" class="cable-path" d="M 0 0 L 0 0" />
    </svg>

    <div id="probe1" class="probe-tip probe-ch1" title="Arrastra al CH1"></div>
    <div id="probe2" class="probe-tip probe-ch2" title="Arrastra al CH2"></div>

    <script>
        const state = {
            ch1Connected: false,
            ch2Connected: false,
            isRunning: true,
            activeChannel: 1,
            
            ch1: { voltsDiv: 1.0, posY: 0, coupling: 'DC', probe: 1, invert: false, amp: 2.0, freq: 1.0, mult: 1000, wave: 'sine', offset: 1.0 },
            ch2: { voltsDiv: 1.0, posY: 0, coupling: 'DC', probe: 1, invert: false, amp: 1.0, freq: 0.5, mult: 100, wave: 'square', offset: -1.0 },
            
            timeDiv: 0.0005,
            posX: 0,
            trigLevel: 0,
            time: 0,
            
            genTarget: 1,
            activeMenu: 'ch1',
            
            cursor: {
                active: false,
                type: 'Voltage',
                source: 1,
                c1: 150,
                c2: 300
            }
        };

        const canvas = document.getElementById('scopeCanvas');
        const ctx = canvas.getContext('2d');
        const redTerminal = document.getElementById('redTerminal');
        const cablePath1 = document.getElementById('pathCH1');
        const cablePath2 = document.getElementById('pathCH2');
        const probe1 = document.getElementById('probe1');
        const probe2 = document.getElementById('probe2');
        const bnc1 = document.getElementById('bnc1');
        const bnc2 = document.getElementById('bnc2');
        const measureBox = document.getElementById('measure-box');
        const labels = [document.getElementById('sk1'), document.getElementById('sk2'), document.getElementById('sk3'), document.getElementById('sk4'), document.getElementById('sk5')];

        function updateCables() {
            const rectRed = redTerminal.getBoundingClientRect();
            const p1Rect = probe1.getBoundingClientRect();
            const startX1 = rectRed.left + rectRed.width / 2;
            const startY1 = rectRed.top + rectRed.height / 2;
            const endX1 = p1Rect.left + p1Rect.width / 2;
            const endY1 = p1Rect.top + p1Rect.height / 2;
            const ctrlX1 = (startX1 + endX1) / 2;
            const ctrlY1 = Math.max(startY1, endY1) + 80;
            cablePath1.setAttribute('d', `M ${startX1} ${startY1} Q ${ctrlX1} ${ctrlY1} ${endX1} ${endY1}`);

            const p2Rect = probe2.getBoundingClientRect();
            const endX2 = p2Rect.left + p2Rect.width / 2;
            const endY2 = p2Rect.top + p2Rect.height / 2;
            const ctrlX2 = (startX1 + endX2) / 2;
            const ctrlY2 = Math.max(startY1, endY2) + 80;
            cablePath2.setAttribute('d', `M ${startX1} ${startY1} Q ${ctrlX2} ${ctrlY2} ${endX2} ${endY2}`);
        }

        window.addEventListener('scroll', updateCables);
        window.addEventListener('resize', updateCables);

        function initProbes() {
            const rectRed = redTerminal.getBoundingClientRect();
            probe1.style.left = (rectRed.left - 50) + 'px';
            probe1.style.top = (rectRed.top + 10) + 'px';
            probe2.style.left = (rectRed.left - 90) + 'px';
            probe2.style.top = (rectRed.top + 10) + 'px';
            updateCables();
        }

        function setupDraggableProbe(probeElement, portElement, channel) {
            let isDragging = false;
            probeElement.addEventListener('pointerdown', (e) => { isDragging = true; probeElement.setPointerCapture(e.pointerId); });
            probeElement.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                probeElement.style.left = (e.clientX - 11) + 'px';
                probeElement.style.top = (e.clientY - 11) + 'px';
                updateCables();
            });
            probeElement.addEventListener('pointerup', (e) => {
                isDragging = false;
                const portRect = portElement.getBoundingClientRect();
                const probeRect = probeElement.getBoundingClientRect();
                const dist = Math.hypot((portRect.left + portRect.width/2) - (probeRect.left + probeRect.width/2), (portRect.top + portRect.height/2) - (probeRect.top + probeRect.height/2));

                if (dist < 50) {
                    if (channel === 1) state.ch1Connected = true; else state.ch2Connected = true;
                    probeElement.style.left = (portRect.left + portRect.width/2 - 11) + 'px';
                    probeElement.style.top = (portRect.top + portRect.height/2 - 11) + 'px';
                    probeElement.style.borderColor = 'transparent';
                    autoSet();
                } else {
                    if (channel === 1) state.ch1Connected = false; else state.ch2Connected = false;
                    probeElement.style.borderColor = '#fff';
                }
            });
        }

        setupDraggableProbe(probe1, bnc1, 1);
        setupDraggableProbe(probe2, bnc2, 2);

        function setGeneratorTarget(ch) {
            state.genTarget = ch;
            document.getElementById('genCh1').classList.toggle('active-ch1', ch === 1);
            document.getElementById('genCh1').classList.toggle('active-ch2', ch === 2);
            document.getElementById('genCh2').classList.toggle('active-ch1', ch === 1);
            document.getElementById('genCh2').classList.toggle('active-ch2', ch === 2);
            
            const chData = ch === 1 ? state.ch1 : state.ch2;
            document.getElementById('genFreq').value = chData.freq;
            document.getElementById('genMult').value = chData.mult;
            document.getElementById('genAmp').value = chData.amp;
            
            document.querySelectorAll('.wave-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.wave === chData.wave);
            });

            updateGenKnobs();
            updateGenDisplay();
        }

        document.getElementById('genFreq').addEventListener('input', (e) => {
            const chData = state.genTarget === 1 ? state.ch1 : state.ch2;
            chData.freq = parseFloat(e.target.value);
            updateGenKnobs();
            updateGenDisplay();
        });
        document.getElementById('genMult').addEventListener('change', (e) => {
            const chData = state.genTarget === 1 ? state.ch1 : state.ch2;
            chData.mult = parseFloat(e.target.value);
            updateGenKnobs();
            updateGenDisplay();
        });
        document.getElementById('genAmp').addEventListener('input', (e) => {
            const chData = state.genTarget === 1 ? state.ch1 : state.ch2;
            chData.amp = parseFloat(e.target.value);
            updateGenKnobs();
            updateGenDisplay();
        });

        function setWave(type) {
            const chData = state.genTarget === 1 ? state.ch1 : state.ch2;
            chData.wave = type;
            document.querySelectorAll('.wave-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.wave === type));
        }

        function updateGenKnobs() {
            const chData = state.genTarget === 1 ? state.ch1 : state.ch2;
            const angleFreq = -135 + ((chData.freq - 1) / 9) * 270;
            document.getElementById('genKnobFreq').style.transform = `rotate(${angleFreq}deg)`;
            const angleAmp = -135 + ((chData.amp - 0.1) / 9.9) * 270;
            document.getElementById('genKnobAmp').style.transform = `rotate(${angleAmp}deg)`;
        }

        function updateGenDisplay() {
            const chData = state.genTarget === 1 ? state.ch1 : state.ch2;
            const freq = chData.freq * chData.mult;
            const vpp = chData.amp * 2;
            
            let fStr = freq >= 1000 ? (freq/1000).toFixed(2) + ' kHz' : freq.toFixed(1) + ' Hz';
            document.getElementById('genDisplayFreq').innerText = `f: ${fStr}`;
            document.getElementById('genDisplayVolt').innerText = `Vpp: ${vpp.toFixed(2)} V`;
        }

        // Lógica mejorada para móviles y corrección de límites
        function makeKnobInteractive(knobElement, onChange) {
            let startY = 0, startValue = 0;
            knobElement.addEventListener('pointerdown', (e) => {
                // Evita el scroll accidental en móviles al tocar la perilla
                if (e.pointerType === 'touch') e.preventDefault(); 
                
                startY = e.clientY;
                startValue = knobElement.dataset.value ? parseFloat(knobElement.dataset.value) : 0;
                knobElement.setPointerCapture(e.pointerId);
            });
            
            knobElement.addEventListener('pointermove', (e) => {
                if (!knobElement.hasPointerCapture(e.pointerId)) return;
                
                const deltaY = startY - e.clientY;
                // Aumentar sensibilidad para pantallas táctiles (0.1 en vez de 0.05)
                const sensitivity = e.pointerType === 'touch' ? 0.1 : 0.05;
                const newValue = startValue + (deltaY * sensitivity);
                
                // El callback devuelve el valor real (con los límites aplicados)
                const actualValue = onChange(newValue);
                
                // Actualizamos el indicador visual con el valor real
                const angle = actualValue * 45;
                knobElement.querySelector('.knob-indicator').style.transform = `translateX(-50%) rotate(${angle}deg)`;
                knobElement.dataset.value = actualValue;
            });
        }

        makeKnobInteractive(document.getElementById('knobPosY'), (val) => {
            const ch = state.activeChannel === 1 ? state.ch1 : state.ch2;
            ch.posY = Math.max(-5, Math.min(5, val));
            return ch.posY; // Retornamos el valor limitado
        });

        makeKnobInteractive(document.getElementById('knobScaleY'), (val) => {
            const steps = [0.1, 0.2, 0.5, 1, 2, 5];
            let idx = Math.round(val + 3); 
            idx = Math.max(0, Math.min(steps.length - 1, idx));
            const ch = state.activeChannel === 1 ? state.ch1 : state.ch2;
            ch.voltsDiv = steps[idx];
            updateLabels();
            return idx - 3; // Retornamos el índice limitado
        });

        makeKnobInteractive(document.getElementById('knobPosX'), (val) => {
            state.posX = Math.max(-5, Math.min(5, val));
            return state.posX;
        });
        
        makeKnobInteractive(document.getElementById('knobScaleX'), (val) => {
            const steps = [0.0001, 0.0002, 0.0005, 0.001, 0.002, 0.005, 0.01];
            let idx = Math.round(val + 3);
            idx = Math.max(0, Math.min(steps.length - 1, idx));
            state.timeDiv = steps[idx];
            updateLabels();
            return idx - 3;
        });

        makeKnobInteractive(document.getElementById('knobTrigLevel'), (val) => {
            state.trigLevel = Math.max(-5, Math.min(5, val));
            return state.trigLevel;
        });

        let draggingCursor = 0;

        canvas.addEventListener('pointerdown', (e) => {
            if (!state.cursor.active) return;
            if (e.pointerType === 'touch') e.preventDefault();
            
            const rect = canvas.getBoundingClientRect();
            const y = (e.clientY - rect.top) * (canvas.height / rect.height);
            const x = (e.clientX - rect.left) * (canvas.width / rect.width);

            if (state.cursor.type === 'Voltage') {
                if (Math.abs(y - state.cursor.c1) < 20) draggingCursor = 1;
                else if (Math.abs(y - state.cursor.c2) < 20) draggingCursor = 2;
            } else {
                if (Math.abs(x - state.cursor.c1) < 20) draggingCursor = 1;
                else if (Math.abs(x - state.cursor.c2) < 20) draggingCursor = 2;
            }
            if (draggingCursor) canvas.setPointerCapture(e.pointerId);
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!draggingCursor) return;
            const rect = canvas.getBoundingClientRect();
            const y = (e.clientY - rect.top) * (canvas.height / rect.height);
            const x = (e.clientX - rect.left) * (canvas.width / rect.width);

            if (state.cursor.type === 'Voltage') {
                let newY = Math.max(0, Math.min(canvas.height, y));
                if (draggingCursor === 1) state.cursor.c1 = newY;
                else state.cursor.c2 = newY;
            } else {
                let newX = Math.max(0, Math.min(canvas.width, x));
                if (draggingCursor === 1) state.cursor.c1 = newX;
                else state.cursor.c2 = newX;
            }
            updateCursorReadout();
        });

        canvas.addEventListener('pointerup', (e) => {
            draggingCursor = 0;
            canvas.releasePointerCapture(e.pointerId);
        });

        function autoSet() {
            if (!state.ch1Connected && !state.ch2Connected) return;
            const freq = state.ch1.freq * state.ch1.mult;
            const period = 1 / freq;
            state.timeDiv = [0.0001, 0.0002, 0.0005, 0.001, 0.002, 0.005, 0.01, 0.02].reduce((p, c) => Math.abs(c - period/2) < Math.abs(p - period/2) ? c : p);
            updateLabels();
        }

        function toggleRunStop() {
            state.isRunning = !state.isRunning;
            document.getElementById('runStopBtn').style.background = state.isRunning ? '' : '#ffaaaa';
            document.getElementById('trig-info').innerText = state.isRunning ? 'Trig Auto' : 'Trig Stop';
        }

        function forceTrigger() {
            state.time += 0.005;
            document.getElementById('trig-info').innerText = 'Trig Forced';
            setTimeout(() => { document.getElementById('trig-info').innerText = state.isRunning ? 'Trig Auto' : 'Trig Stop'; }, 1000);
        }

        function trigger50() {
            state.trigLevel = 0;
            const knobTrig = document.getElementById('knobTrigLevel');
            knobTrig.querySelector('.knob-indicator').style.transform = `translateX(-50%) rotate(0deg)`;
            knobTrig.dataset.value = 0;
        }

        function selectChannel(ch) {
            state.activeChannel = ch;
            document.getElementById('ch1Btn').classList.toggle('active', ch === 1);
            document.getElementById('ch2Btn').classList.toggle('active', ch === 2);
            changeMenu(ch === 1 ? 'ch1' : 'ch2');
        }

        function changeMenu(menu) {
            state.activeMenu = menu;
            updateSoftKeyTexts();
        }

        function updateSoftKeyTexts() {
            labels.forEach(l => l.innerText = "");
            if (state.activeMenu === 'ch1' || state.activeMenu === 'ch2') {
                const ch = state.activeMenu === 'ch1' ? state.ch1 : state.ch2;
                labels[0].innerText = `Coupling ${ch.coupling}`;
                labels[1].innerText = `BW Limit OFF`;
                labels[2].innerText = `Probe ${ch.probe}X`;
                labels[3].innerText = `Invert ${ch.invert ? 'ON' : 'OFF'}`;
            } else if (state.activeMenu === 'cursor') {
                labels[0].innerText = `Mode Manual`;
                labels[1].innerText = `Type ${state.cursor.type}`;
                labels[2].innerText = `Source CH${state.cursor.source}`;
                labels[3].innerText = state.cursor.active ? `Clear` : `Display`;
            }
        }

        function handleSoftKey(key) {
            if (state.activeMenu === 'ch1' || state.activeMenu === 'ch2') {
                const ch = state.activeMenu === 'ch1' ? state.ch1 : state.ch2;
                if (key === 1) { ch.coupling = ch.coupling === 'DC' ? 'AC' : (ch.coupling === 'AC' ? 'GND' : 'DC'); }
                if (key === 3) { ch.probe = ch.probe === 1 ? 10 : (ch.probe === 10 ? 100 : 1); }
                if (key === 4) { ch.invert = !ch.invert; }
                updateSoftKeyTexts();
            } else if (state.activeMenu === 'cursor') {
                if (key === 2) {
                    state.cursor.type = state.cursor.type === 'Voltage' ? 'Time' : 'Voltage';
                    if (state.cursor.type === 'Voltage') { state.cursor.c1 = 250; state.cursor.c2 = 500; }
                    else { state.cursor.c1 = 300; state.cursor.c2 = 700; }
                }
                if (key === 3) { state.cursor.source = state.cursor.source === 1 ? 2 : 1; }
                if (key === 4) {
                    state.cursor.active = !state.cursor.active;
                    if (state.cursor.active) measureBox.style.display = 'block';
                    else measureBox.style.display = 'none';
                }
                updateSoftKeyTexts();
            }
        }

        function updateLabels() {
            let tStr = state.timeDiv >= 0.001 ? (state.timeDiv * 1000).toFixed(2) + 'ms' : (state.timeDiv * 1000000).toFixed(0) + 'µs';
            document.getElementById('time-info').innerText = `Time ${tStr}`;
            
            let v1Str = state.ch1.voltsDiv >= 1 ? state.ch1.voltsDiv.toFixed(2) + 'V' : (state.ch1.voltsDiv * 1000).toFixed(0) + 'mV';
            document.getElementById('ch1-info').innerText = `CH1 ${v1Str}`;
            
            let v2Str = state.ch2.voltsDiv >= 1 ? state.ch2.voltsDiv.toFixed(2) + 'V' : (state.ch2.voltsDiv * 1000).toFixed(0) + 'mV';
            document.getElementById('ch2-info').innerText = `CH2 ${v2Str}`;
        }

        function getWaveValue(t, chData) {
            const f = chData.freq * chData.mult;
            const phase = 2 * Math.PI * f * (t + state.trigLevel * 0.05); 
            switch(chData.wave) {
                case 'sine': return Math.sin(phase);
                case 'square': return Math.sign(Math.sin(phase));
                case 'triangle': return (2 / Math.PI) * Math.asin(Math.sin(phase));
                default: return 0;
            }
        }

        function updateCursorReadout() {
            if (!state.cursor.active) return;
            const w = canvas.width;
            const h = canvas.height;
            const ch = state.cursor.source === 1 ? state.ch1 : state.ch2;
            const pxDivY = h / 8;
            const pxDivX = w / 10;

            if (state.cursor.type === 'Voltage') {
                const v1 = ((h/2 - state.cursor.c1) / pxDivY - ch.posY) * ch.voltsDiv;
                const v2 = ((h/2 - state.cursor.c2) / pxDivY - ch.posY) * ch.voltsDiv;
                const deltaV = Math.abs(v1 - v2);
                measureBox.innerHTML = `CH${state.cursor.source} Cursor 1: ${v1.toFixed(2)} V<br>
                                        CH${state.cursor.source} Cursor 2: ${v2.toFixed(2)} V<br>
                                        <span style="color:#ff3333; font-weight:bold;">ΔV: ${deltaV.toFixed(2)} V</span>`;
            } else {
                const t1 = (state.cursor.c1 / pxDivX + state.posX) * state.timeDiv;
                const t2 = (state.cursor.c2 / pxDivX + state.posX) * state.timeDiv;
                const deltaT = Math.abs(t1 - t2);
                const freq = deltaT > 0 ? 1 / deltaT : 0;
                let fStr = freq >= 1000 ? (freq/1000).toFixed(2) + ' kHz' : freq.toFixed(1) + ' Hz';
                
                measureBox.innerHTML = `CH${state.cursor.source} Cursor 1: ${(t1*1000).toFixed(2)} ms<br>
                                        CH${state.cursor.source} Cursor 2: ${(t2*1000).toFixed(2)} ms<br>
                                        <span style="color:#ff3333; font-weight:bold;">ΔT: ${(deltaT*1000).toFixed(2)} ms</span><br>
                                        <span style="color:#ff3333; font-weight:bold;">Δf: ${fStr}</span>`;
            }
        }

        let lastTime = performance.now();

        function render(time) {
            updateCables();
            const deltaTime = (time - lastTime) / 1000;
            lastTime = time;
            if (state.isRunning) state.time += deltaTime;

            const w = canvas.width;
            const h = canvas.height;
            ctx.fillStyle = '#051405';
            ctx.fillRect(0, 0, w, h);

            ctx.strokeStyle = '#1e3a1e'; ctx.lineWidth = 1;
            for (let i = 1; i < 10; i++) { ctx.beginPath(); ctx.moveTo((w / 10) * i, 0); ctx.lineTo((w / 10) * i, h); ctx.stroke(); }
            for (let i = 1; i < 8; i++) { ctx.beginPath(); ctx.moveTo(0, (h / 8) * i); ctx.lineTo(w, (h / 8) * i); ctx.stroke(); }
            
            ctx.strokeStyle = '#2a5a2a';
            ctx.beginPath(); ctx.moveTo(0, h/2); ctx.lineTo(w, h/2); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(w/2, 0); ctx.lineTo(w/2, h); ctx.stroke();
            
            ctx.fillStyle = '#ff3333';
            ctx.beginPath(); ctx.moveTo(w/2, 10); ctx.lineTo(w/2 - 5, 0); ctx.lineTo(w/2 + 5, 0); ctx.fill();
            
            const pxDivY = h / 8;
            let trigY = h/2 - (state.trigLevel / state.ch1.voltsDiv) * pxDivY;
            ctx.beginPath(); ctx.moveTo(w - 20, Math.max(0, Math.min(h, trigY))); ctx.lineTo(w, Math.max(0, Math.min(h, trigY)) - 8); ctx.lineTo(w, Math.max(0, Math.min(h, trigY)) + 8); ctx.fill();

            drawChannel(w, h, state.ch1, state.ch1Connected, '#fcec03');
            drawChannel(w, h, state.ch2, state.ch2Connected, '#00f0ff');

            if (state.cursor.active) {
                drawCursors(w, h);
            }

            requestAnimationFrame(render);
        }

        function drawChannel(w, h, chState, isConnected, color) {
            if (!isConnected) return;
            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.shadowBlur = 5;
            ctx.shadowColor = color;
            const pxDivX = w / 10;
            const pxDivY = h / 8;

            for (let x = 0; x < w; x++) {
                let tAtPixel = (x / w) * 10 * state.timeDiv;
                tAtPixel += state.posX * state.timeDiv;
                let val = getWaveValue(tAtPixel + state.time, chState);
                
                let voltage = val * chState.amp;
                if (chState.coupling === 'DC') voltage += chState.offset;
                else if (chState.coupling === 'GND') voltage = 0;
                
                voltage *= chState.probe;
                if (chState.invert) voltage = -voltage;

                let yOffset = (voltage / chState.voltsDiv) * pxDivY;
                let y = h/2 - yOffset + (chState.posY * pxDivY);
                
                if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        function drawCursors(w, h) {
            ctx.setLineDash([5, 5]);
            ctx.strokeStyle = '#ff3333';
            ctx.lineWidth = 1.5;
            ctx.font = '12px monospace';

            if (state.cursor.type === 'Voltage') {
                ctx.beginPath(); ctx.moveTo(0, state.cursor.c1); ctx.lineTo(w, state.cursor.c1); ctx.stroke();
                ctx.fillStyle = '#ff3333'; ctx.fillText(`C1`, 10, state.cursor.c1 - 5);
                
                ctx.beginPath(); ctx.moveTo(0, state.cursor.c2); ctx.lineTo(w, state.cursor.c2); ctx.stroke();
                ctx.fillText(`C2`, 10, state.cursor.c2 - 5);
            } else {
                ctx.beginPath(); ctx.moveTo(state.cursor.c1, 0); ctx.lineTo(state.cursor.c1, h); ctx.stroke();
                ctx.fillStyle = '#ff3333'; ctx.fillText(`C1`, state.cursor.c1 + 5, 20);
                
                ctx.beginPath(); ctx.moveTo(state.cursor.c2, 0); ctx.lineTo(state.cursor.c2, h); ctx.stroke();
                ctx.fillText(`C2`, state.cursor.c2 + 5, 20);
            }
            ctx.setLineDash([]);
            updateCursorReadout();
        }

        window.onload = () => {
            setTimeout(() => {
                initProbes();
                updateGenKnobs();
                updateGenDisplay();
                updateLabels();
                selectChannel(1);
                requestAnimationFrame(render);
            }, 50);
        };

    </script>
</body>
</html>
